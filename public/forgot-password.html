<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | UI CSC Admin</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-card">
        <img src="logo.jpg" class="login-logo" alt="UI CSC Logo">

        <h2>Forgot Password?</h2>
        <p>Enter your registered administrator email to receive a password reset link.</p>

        <div id="reset-form-container">
            <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem;">Email Address</label>
                <input 
                    id="reset-email" 
                    type="email" 
                    placeholder="Enter your admin email" 
                    style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none;">
            </div>

            <button id="send-reset-btn" class="primary-btn" style="width: 100%; margin-bottom: 15px;">
                Send Reset Link
            </button>
        </div>

        <div id="success-container" class="hidden" style="margin-bottom: 20px;">
            <span class="material-icons" style="font-size: 48px; color: var(--success); margin-bottom: 10px;">check_circle</span>
            <p style="color: #333; font-weight: 500;">Reset link sent successfully!</p>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Please check your inbox (and spam folder) for instructions to reset your password.</p>
        </div>

        <p id="reset-error" class="error-message" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 15px;"></p>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <a href="login.html" style="text-decoration: none; color: var(--brand-primary); font-weight: 500; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 5px;">
            <span class="material-icons" style="font-size: 18px;">arrow_back</span> Back to Login
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="firebase.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
