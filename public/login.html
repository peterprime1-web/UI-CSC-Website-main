<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UI CSC Admin Login</title>

    <link rel="stylesheet" href="admin.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

</head>

<body class="login-page">

    <div class="login-card">

        <img
            src="logo.jpg"
            class="login-logo"
            alt="UI CSC">

        <h2>

            Admin Portal

        </h2>

        <p>

            Sign in to continue

        </p>

        <div class="form-group">

            <label>Email</label>

            <input
                id="login-email"
                type="email"
                placeholder="Email">

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                id="login-password"
                type="password"
                placeholder="Password">

        </div>

        <label class="remember-me">

            <input
                id="remember-me"
                type="checkbox">

            Remember Me

        </label>

        <button
            id="login-btn"
            class="primary-btn">

            Login

        </button>

        

        <div style="text-align: left; margin-top: 15px;">
            <a href="index.html" style="text-decoration: none; font-size: 0.9rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px;">
                <span class="material-icons" style="font-size: 1.1rem;">arrow_back</span>
                Back to Student Portal
            </a>
        </div>

        <a href="forgot-password.html" style="display: block; text-align: right; margin-top: -10px; margin-bottom: 20px; font-size: 0.85rem; text-decoration: none; color: #4a90e2;">Forgot Password?</a>

        <p
            id="login-error"
            class="error-message"></p>

    </div>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="firebase.js"></script>

    <script src="auth.js"></script>

    <script src="login.js"></script>

</body>

</html>
